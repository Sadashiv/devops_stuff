version: "3"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_app
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: linux_mgmt
      DB_USER: sadashiv
      DB_PASSWORD: Sadashiv@123
      DB_HOST:     db
      DB_PORT:     5432
      DEBUG:       1
    depends_on:
      db:
        condition: service_healthy   # ✅ waits for postgres to be ready

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: linux_mgmt
      POSTGRES_USER: sadashiv
      POSTGRES_PASSWORD: Sadashiv@123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 10s
      timeout:  5s
      retries:  5
volumes:
  postgres_data:                     # named volume — data persists
